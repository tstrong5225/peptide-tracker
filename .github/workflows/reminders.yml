name: Send dose reminders

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes UTC (GitHub Actions minimum interval)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reminder cron endpoint
        run: |
          curl --fail-with-body -sS -X GET \
            "${{ vars.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
